<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Open BT Bricorama</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=20260224" />

  <style>
    /* ✅ Bandeau index */
    .topbar-row-step{
      grid-template-columns: var(--logo-size) 1fr var(--logo-size);
    }
    .step-title-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: calc(var(--logo-size) * 0.55);
    }
    .step-title-img{
      width:min(520px,100%);
      max-height:88px;
      height:auto;
      object-fit:contain;
      display:block;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.15));
    }

    /* ✅ NAV — FORCÉE EN 2 LIGNES (3 colonnes fixes) */
    .nav-step{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:8px;
    }
    .nav-step a{
      display:block;
      text-align:center;
      white-space:nowrap;
      min-width:0;
      padding:8px 10px;
    }
    .nav a[aria-current="page"]{
      background: rgba(255,255,255,.26);
      border-color: rgba(255,255,255,.45);
      box-shadow: 0 6px 14px rgba(0,0,0,.10);
    }
    @media (max-width:420px){
      .nav-step a{
        padding:7px 8px;
        font-size:13px;
      }
      .step-title-img{ max-height:74px; }
    }

    /* ✅ Contact */
    .hero{
      text-align:center;
      padding:6px 0 0;
    }
    .hero h2{
      margin:0 0 6px;
      font-size:34px;
      line-height:1.1;
      letter-spacing:-.3px;
    }
    .hero p{
      margin:0 auto;
      max-width:680px;
      font-size:18px;
      line-height:1.45;
      color:#222;
      font-weight:700;
    }

    .contacts{
      margin-top:16px;
      display:grid;
      gap:12px;
    }

    .contact-card{
      border:1px solid #eee;
      border-radius:18px;
      background:#fff;
      padding:14px;
      box-shadow:0 8px 18px rgba(0,0,0,.05);
      display:grid;
      gap:10px;
      min-width:0;
    }

    .card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .card-title{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .ico{
      font-size:22px;
      width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:12px;
      border:1px solid #eee;
      background:#fafafa;
      flex:0 0 auto;
    }

    .who{
      font-weight:950;
      font-size:18px;
      line-height:1.1;
    }

    .sub{
      color:#555;
      font-weight:800;
      font-size:13px;
      margin-top:2px;
    }

    .value{
      font-size:18px;
      font-weight:950;
      color:#111;
      text-decoration:none;
    }

    /* ✅ Email tient sur UNE ligne */
    .value.email{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:15px;
    }
    @media (max-width:420px){
      .value.email{
        font-size:14px;
      }
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
    }

    .btn-sm{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid #ddd;
      background:#fafafa;
      font-weight:950;
      color:#111;
      text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
      flex: 1 1 auto;
    }
    .btn-sm.primary{
      background:#fff;
      border-color:#cfcfcf;
      box-shadow:0 6px 14px rgba(0,0,0,.06);
    }

    @media (min-width:760px){
      .contacts{ grid-template-columns:1fr 1fr; }
      .btn-sm{ flex: 0 0 auto; }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="container">

    <div class="topbar-row topbar-row-step">
      <div class="brand-logo">
        <img src="../assets/img/logo-suzini.png" alt="Logo Suzini">
      </div>

      <div class="step-title-wrap">
        <img class="step-title-img" src="../assets/img/bt250.png" alt="BT250">
      </div>

      <div class="brand-logo">
        <img src="../assets/img/logo-openbt.png" alt="Logo Open BT">
      </div>
    </div>

    <nav class="nav nav-step">
      <a href="../index.html">🏠 Accueil</a>
      <a href="reglement.html">📘 Règlement</a>
      <a href="infos.html">ℹ️ Infos</a>
      <a href="repas.html">🍽️ Repas</a>
      <a href="boutique.html">🛍️ Boutique</a>
      <a href="contact.html" aria-current="page">📩 Contact</a>
    </nav>

  </div>
</header>

<main class="container">

  <section class="card">
    <div class="hero">
      <h2>📩 Contact</h2>
      <p>
        Pour toute question sur l’<b>Open BT Bricorama</b>, contacte la <b>commission Beach Tennis</b>.
      </p>
    </div>

    <div class="contacts">

      <!-- EMAIL -->
      <div class="contact-card">
        <div class="card-title">
          <div class="ico">📧</div>
          <div>
            <div class="who">Email</div>
            <div class="sub">Commission Beach Tennis</div>
          </div>
        </div>

        <a class="value email" href="mailto:tcsuzini.beachtennis@gmail.com">
          tcsuzini.beachtennis@gmail.com
        </a>

        <div class="actions">
          <a class="btn-sm primary" href="mailto:tcsuzini.beachtennis@gmail.com">✉️ Écrire</a>
          <button class="btn-sm" type="button" data-copy="tcsuzini.beachtennis@gmail.com">📋 Copier</button>
        </div>
      </div>

      <!-- JULES -->
      <div class="contact-card">
        <div class="card-title">
          <div class="ico">📱</div>
          <div>
            <div class="who">Jules</div>
            <div class="sub">Organisation</div>
          </div>
        </div>

        <a class="value" href="tel:+594694406099">+594 694 40 60 99</a>

        <div class="actions">
          <a class="btn-sm primary" href="tel:+594694406099">📞 Appeler</a>
          <a class="btn-sm" href="https://wa.me/594694406099" target="_blank">💬 WhatsApp</a>
        </div>
      </div>

    </div>
  </section>

</main>

<script>
  document.addEventListener("click", async (e)=>{
    const btn = e.target.closest("[data-copy]");
    if(!btn) return;
    const txt = btn.getAttribute("data-copy") || "";
    try{
      await navigator.clipboard.writeText(txt);
      btn.textContent = "✅ Copié";
      setTimeout(()=> btn.textContent = "📋 Copier", 900);
    }catch(err){
      alert("Copie impossible.");
    }
  });
</script>

</body>
</html>
