<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infos — Open BT Bricorama</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=20260224" />

  <style>
    /* ===== BANDEAU IDENTIQUE INDEX ===== */
    .topbar-row-step{
      grid-template-columns: var(--logo-size) 1fr var(--logo-size);
    }
    .step-title-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: calc(var(--logo-size) * 0.55);
    }
    .step-title-img{
      width: min(520px, 100%);
      max-height: 88px;
      height: auto;
      object-fit: contain;
      display:block;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,.15));
    }

    /* Nav 2 lignes sur téléphone (6 onglets => 3 + 3) */
    .nav-step{
      gap:8px;
      flex-wrap:wrap;
    }
    .nav-step a{
      padding:8px 12px;
      flex: 0 0 auto;
      text-align:center;
      white-space:nowrap;
    }
    @media (max-width: 560px){
      .nav-step{ justify-content:space-between; }
      .nav-step a{ width: calc((100% - 16px) / 3); }
    }
    @media (max-width: 420px){
      .nav-step a{
        padding:7px 10px;
        font-size: 13px;
      }
      .step-title-img{ max-height: 74px; }
    }

    /* Lien actif */
    .nav a[aria-current="page"]{
      background: rgba(255,255,255,.26);
      border-color: rgba(255,255,255,.45);
      box-shadow: 0 6px 14px rgba(0,0,0,.10);
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="container">

    <div class="topbar-row topbar-row-step">
      <div class="brand-logo">
        <img src="../assets/img/logo-suzini.png" alt="Logo Suzini">
      </div>

      <div class="step-title-wrap" aria-label="Open BT Bricorama">
        <img class="step-title-img" src="../assets/img/bt250.png" alt="BT250 — Open BT Bricorama">
      </div>

      <div class="brand-logo">
        <img src="../assets/img/logo-openbt.png" alt="Logo Open BT Bricorama">
      </div>
    </div>

    <nav class="nav nav-step">
      <a href="../index.html">🏠 Accueil</a>
      <a href="reglement.html">📘 Règlement</a>
      <a href="infos.html" aria-current="page">ℹ️ Infos</a>
      <a href="repas.html">🍽️ Repas</a>
      <a href="boutique.html">🛍️ Boutique</a>
      <a href="contact.html">📩 Contact</a>
    </nav>

  </div>
</header>

<main class="container">

  <!-- Public: fil d'infos -->
  <section class="card">
    <h2 style="margin:0 0 10px 0;">📰 Dernières infos</h2>
    <p class="muted" style="margin-top:0;">
      Retrouvez ici les dernières annonces de l’organisation (Open BT Bricorama).
    </p>

    <!-- Compteur / statut -->
    <p class="muted" id="infosCount" style="margin:10px 0 0;">Chargement…</p>

    <!-- Liste -->
    <div id="infosList" style="display:grid; gap:10px; margin-top:10px;"></div>
  </section>

</main>

<script type="module">
  import { db } from "../assets/js/firebase.js";
  import {
    collection,
    query,
    orderBy,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // ✅ Collection Open BT
  const COL_INFOS = "infos";

  // DOM
  const infosList  = document.getElementById("infosList");
  const infosCount = document.getElementById("infosCount");

  function escapeHTML(str){
    return (str || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtDate(ts){
    try{
      const d = ts?.toDate ? ts.toDate() : null;
      if(!d) return "—";
      return d.toLocaleString("fr-FR", {
        year:"numeric", month:"long", day:"numeric",
        hour:"2-digit", minute:"2-digit"
      });
    } catch {
      return "—";
    }
  }

  function renderInfos(items){
    infosList.innerHTML = "";
    infosCount.textContent = `📌 ${items.length} info${items.length > 1 ? "s" : ""}`;

    if(items.length === 0){
      infosList.innerHTML = `<p class="muted" style="margin:0;">Aucune info pour le moment.</p>`;
      return;
    }

    for(const it of items){
      const title = escapeHTML(it.title);
      const text  = escapeHTML(it.text).replaceAll("\\n","<br>");
      const date  = fmtDate(it.createdAt);

      const card = document.createElement("div");
      card.className = "card";
      card.style.margin = "0";

      card.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:6px;">
          <div style="font-weight:900;">${title}</div>
          <div class="muted" style="margin:0;">🗓️ ${date}</div>
          <div style="margin-top:2px; line-height:1.45;">${text}</div>
        </div>
      `;

      infosList.appendChild(card);
    }
  }

  // 🔄 Flux live (plus récent en haut)
  infosCount.textContent = "Chargement…";
  const q = query(collection(db, COL_INFOS), orderBy("createdAt", "desc"));

  onSnapshot(q, (snap) => {
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderInfos(items);
  }, (err) => {
    console.error(err);
    infosCount.textContent = "❌ Impossible de charger les infos.";
  });
</script>

</body>
</html>
