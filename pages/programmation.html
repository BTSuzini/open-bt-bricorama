<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Programmation — Open BT Bricorama</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=20260228-open-global-prog-v1" />
</head>
<body>

<header class="topbar">
  <div class="container">
    <div class="topbar-row topbar-row-step">
      <div class="brand-logo">
        <img src="../assets/img/logo-suzini.png" alt="Logo Suzini">
      </div>

      <div class="step-title-wrap" aria-label="Open BT — Programmation">
        <img class="step-title-img" src="../assets/img/bt250.png" alt="BT250">
      </div>

      <div class="brand-logo">
        <img src="../assets/img/logo-openbt.png" alt="Logo Open BT Bricorama">
      </div>
    </div>

    <nav class="nav nav-step">
      <a href="../index.html" title="Accueil" aria-label="Accueil">🏠</a>
      <a href="inscriptions.html">📝 Inscriptions</a>
      <a href="tirage.html" title="Tirage" aria-label="Tirage">🎲</a>
      <a href="equipes.html" aria-label="Équipes">👥 Équipes</a>
      <a href="programmation.html" aria-current="page">🗓️ Programme</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="card">
    <h2 style="margin:0 0 10px;">🗓️ Programmation (DH + DD)</h2>
    <p class="muted" id="statusText" style="margin:0;">Chargement…</p>
    <p class="muted" id="subtitle" style="margin-top:10px;"></p>
  </section>

  <section class="card" id="panelChrono" style="display:block;">
    <h2 style="margin:0 0 10px;">🕒 Planning global — 2 terrains</h2>
    <div id="chronoList"></div>

    <p class="muted" style="margin-top:10px;">
      ⏱️ Affichage basé sur les programmations publiées par l’organisation (Firestore).
    </p>
  </section>

</main>

<style>
  .topbar-row-step{ grid-template-columns: var(--logo-size) 1fr var(--logo-size); }
  .step-title-wrap{
    display:flex; align-items:center; justify-content:center;
    min-height: calc(var(--logo-size) * 0.55);
  }
  .step-title-img{
    width:min(520px,100%); max-height:88px; height:auto; object-fit:contain;
    display:block; filter: drop-shadow(0 1px 0 rgba(0,0,0,.15));
  }

  .nav-step{ gap:8px; flex-wrap:wrap; }
  .nav-step a{ padding:8px 12px; flex:0 0 auto; text-align:center; white-space:nowrap; }
  @media (max-width: 560px){
    .nav-step{ justify-content:space-between; }
    .nav-step a{ width: calc((100% - 16px) / 3); }
    .nav-step a:nth-child(n+4){ width: calc((100% - 8px) / 2); }
  }
  @media (max-width: 420px){
    .nav-step a{ padding:7px 10px; font-size:13px; }
    .step-title-img{ max-height:74px; }
  }
  .nav a[aria-current="page"]{
    background: rgba(255,255,255,.26);
    border-color: rgba(255,255,255,.45);
    box-shadow: 0 6px 14px rgba(0,0,0,.10);
  }

  .match-list{ display:flex; flex-direction:column; gap:14px; }

  .match-card{
    border-radius:18px;
    border:2px solid rgba(0,0,0,.06);
    padding:14px;
    background:#fff;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .match-card.courtA{ background:#FFF6D6; border-color:rgba(255, 196, 0, .35); }
  .match-card.courtB{ background:#FFE6EA; border-color:rgba(255, 0, 60, .25); }
  .match-card.block{ background:#F3F6FF; border-color:rgba(60, 110, 255, .20); }

  .match-head{ display:flex; align-items:center; gap:10px; min-width:0; }
  .m-time{ font-size:13px; font-weight:900; white-space:nowrap; letter-spacing:.2px; }
  .m-court{
    font-size:13px; font-weight:400; font-style:italic; opacity:.95;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1;
  }
  .m-tag{
    font-size:11px; font-weight:1000; white-space:nowrap;
    border:1px solid rgba(0,0,0,.12); border-radius:999px; padding:6px 10px; opacity:.95;
    flex:0 0 auto;
  }

  .team-row{ margin-top:10px; display:grid; grid-template-columns:1fr; gap:6px; }
  .team-title{ font-size:15px; font-weight:950; line-height:1.15; white-space:normal; overflow-wrap:anywhere; }
  .team-sub{ font-size:13px; font-weight:700; opacity:.85; white-space:normal; overflow-wrap:anywhere; line-height:1.25; }
  .vs-line{ margin:10px 0 6px; text-align:center; font-weight:900; letter-spacing:2px; opacity:.55; font-size:12px; }
</style>

<script type="module">
  import { db } from "../assets/js/firebase.js";
  import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const statusText = document.getElementById("statusText");
  const subtitle   = document.getElementById("subtitle");
  const chronoList = document.getElementById("chronoList");

  const COURTS_FALLBACK = {
    A: "court Manon Queen Bee",
    B: "court Lisa de Los Pimentos"
  };

  let progDH = null;
  let progDD = null;

  function esc(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;");
  }

  function parseHHMM(hhmm){
    const m = /^(\d{1,2}):(\d{2})$/.exec((hhmm||"").trim());
    if(!m) return Number.POSITIVE_INFINITY;
    return Number(m[1])*60 + Number(m[2]);
  }

  function teamTitle(t){ return (t?.teamName || "Équipe").toString(); }
  function teamSub(t){
    const p1 = (t?.p1FirstName || "").toString().trim();
    const p2 = (t?.p2FirstName || "").toString().trim();
    if(!p1 && !p2) return "";
    return `${p1}${p1 && p2 ? " • " : ""}${p2}`;
  }

  function normalizeEntry(entry, slotObj){
    if(typeof entry === "number"){
      const slot = Number(entry);
      const court = slotObj?.court || "A";
      return { slot, court };
    }
    if(entry && typeof entry === "object"){
      const slot = Number(entry.slot);
      const court = entry.court || slotObj?.court || "A";
      return { slot, court };
    }
    return { slot: Number(slotObj?.slot || 1), court: slotObj?.court || "A" };
  }

  function courtLabel(courts, key){
    const name = (courts?.[key] || COURTS_FALLBACK[key] || key || "—");
    const emo = (key === "A") ? "🐝" : (key === "B" ? "🌶️" : "🎾");
    return `${emo} ${name} ${emo}`;
  }
  function courtClass(key){
    return (key === "A") ? "courtA" : (key === "B" ? "courtB" : "");
  }

  function matchCard({ time, courtKey, courts, cat, stage, A, B }){
    return `
      <div class="match-card ${esc(courtClass(courtKey))}">
        <div class="match-head">
          <div class="m-time">${esc(time)}</div>
          <div class="m-court">${esc(courtLabel(courts, courtKey))}</div>
          <div class="m-tag">${esc(cat)} · ${esc(stage)}</div>
        </div>

        <div class="team-row">
          <div class="team-title">${esc(teamTitle(A))}</div>
          <div class="team-sub muted">${esc(teamSub(A))}</div>
        </div>

        <div class="vs-line">VS</div>

        <div class="team-row">
          <div class="team-title">${esc(teamTitle(B))}</div>
          <div class="team-sub muted">${esc(teamSub(B))}</div>
        </div>
      </div>
    `;
  }

  function blockCard({ time, courtKey, courts, title, note }){
    return `
      <div class="match-card block">
        <div class="match-head">
          <div class="m-time">${esc(time)}</div>
          <div class="m-court">${esc(courtLabel(courts, courtKey))}</div>
          <div class="m-tag">⏳ Bloc</div>
        </div>
        <div class="team-row">
          <div class="team-title">${esc(title || "Bloc")}</div>
          ${note ? `<div class="team-sub muted">${esc(note)}</div>` : ``}
        </div>
      </div>
    `;
  }

  function flattenProg(prog, fallbackCat){
    if(!prog || !Array.isArray(prog.slots) || !prog.slots.length) return [];

    const courts = prog.courts || COURTS_FALLBACK;
    const slots = prog.slots || [];
    const matches = prog.matches || {};
    const schedule = prog.schedule || {};

    const slotToMid = new Map();
    for(const [mid, entry] of Object.entries(schedule)){
      const slotNum = (typeof entry === "number") ? Number(entry) : Number(entry?.slot);
      if(!Number.isFinite(slotNum)) continue;
      if(!matches[mid]) continue;
      if(!slotToMid.has(slotNum)) slotToMid.set(slotNum, mid);
    }

    const out = [];
    for(const s of slots){
      const mid = slotToMid.get(Number(s.slot));
      if(!mid) continue;

      const m = matches[mid];
      if(!m) continue;

      const norm = normalizeEntry(schedule[mid], s);
      const courtKey = norm.court || s.court || "A";
      const time = s.time || "—";

      out.push({
        time,
        timeMin: parseHHMM(time),
        courtKey,
        courts,
        kind: m.kind || "match",
        cat: m.cat || fallbackCat,
        stage: m.stage || "",
        A: m.A || null,
        B: m.B || null,
        title: m.title || "",
        note: m.note || ""
      });
    }

    return out;
  }

  function renderAll(){
    const items = [
      ...flattenProg(progDH, "DH"),
      ...flattenProg(progDD, "DD"),
    ].sort((a,b)=>{
      if(a.timeMin !== b.timeMin) return a.timeMin - b.timeMin;
      return (a.courtKey||"").localeCompare(b.courtKey||"");
    });

    if(!items.length){
      statusText.textContent = "ℹ️ Programmation non publiée.";
      subtitle.textContent = "";
      chronoList.innerHTML = `<p class="muted" style="margin:0;">Aucun match pour le moment.</p>`;
      return;
    }

    statusText.textContent = "🟢 En direct";
    subtitle.textContent = "Planning global (DH + DD) mis à jour en direct.";

    const cards = items.map(x=>{
      if(x.kind === "block"){
        return blockCard({
          time: x.time,
          courtKey: x.courtKey,
          courts: x.courts,
          title: x.title || x.stage || "Bloc",
          note: x.note || ""
        });
      }
      return matchCard({
        time: x.time,
        courtKey: x.courtKey,
        courts: x.courts,
        cat: x.cat,
        stage: x.stage,
        A: x.A,
        B: x.B
      });
    });

    chronoList.innerHTML = `<div class="match-list">${cards.join("")}</div>`;
  }

  onSnapshot(
    doc(db, "programmations_open", "dh"),
    (snap)=>{ progDH = snap.exists() ? (snap.data() || null) : null; renderAll(); },
    (err)=>{ console.error(err); statusText.textContent = "🔴 Erreur Firestore (DH)"; }
  );

  onSnapshot(
    doc(db, "programmations_open", "dd"),
    (snap)=>{ progDD = snap.exists() ? (snap.data() || null) : null; renderAll(); },
    (err)=>{ console.error(err); statusText.textContent = "🔴 Erreur Firestore (DD)"; }
  );
</script>

</body>
</html>
