<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscriptions — Double Hommes — Open BT Bricorama</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=20260224" />
</head>
<body>

<header class="topbar">
  <div class="container">
    <!-- ✅ Bandeau harmonisé (logo / image / logo) -->
    <div class="topbar-row topbar-row-step">
      <div class="brand-logo">
        <img src="../assets/img/logo-suzini.png" alt="Logo Suzini">
      </div>

      <!-- ✅ Image au centre -->
      <div class="step-title-wrap" aria-label="BT250 — Double Hommes">
        <img class="step-title-img" src="../assets/img/bt250-dm.png" alt="BT250 — Double Hommes">
      </div>

      <div class="brand-logo">
        <img src="../assets/img/logo-openbt.png" alt="Logo Open BT">
      </div>
    </div>

    <!-- ✅ Nav Open BT : 2 lignes fixes sur téléphone (3 + 2), justifiée -->
    <nav class="nav nav-step">
      <a href="../index.html" title="Accueil" aria-label="Accueil">🏠</a>
      <a href="inscriptions.html" aria-current="page">📝 Inscriptions</a>
      <a href="tirage.html" title="Tirage" aria-label="Tirage">🎲</a>
      <a href="equipes.html">👥 Équipes</a>
      <a href="programmation.html">🗓️ Programme</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="card" id="cardForm">
    <h2>📝 Formulaire d’inscription — Double Hommes</h2>
    <p id="gateMsg" class="muted">Chargement…</p>

    <form id="signupForm" class="form">

      <div class="field">
        <label>Nom de l’équipe *</label>
        <input id="teamName" required maxlength="40">
      </div>

      <hr class="sep" />

      <h3>Joueur 1 👨</h3>
      <div class="field"><label>Nom *</label><input id="p1LastName" required></div>
      <div class="field"><label>Prénom *</label><input id="p1FirstName" required></div>
      <div class="field"><label>N° Licence *</label><input id="p1Licence" required></div>
      <div class="field"><label>Téléphone *</label><input id="p1Phone" required></div>

      <hr class="sep" />

      <h3>Joueur 2 👨</h3>
      <div class="field"><label>Nom *</label><input id="p2LastName" required></div>
      <div class="field"><label>Prénom *</label><input id="p2FirstName" required></div>
      <div class="field"><label>N° Licence *</label><input id="p2Licence" required></div>
      <div class="field"><label>Téléphone *</label><input id="p2Phone" required></div>

      <hr class="sep" />

      <button id="submitBtn" class="btn" type="submit" style="font-weight:900;">✅ Valider</button>
      <p id="status" class="muted"></p>
    </form>
  </section>

  <section class="card" id="cardSuccess" style="display:none;">
    <h2>✅ Inscription enregistrée</h2>
    <p class="muted">Merci pour votre inscription 🙌</p>
    <div class="grid" style="margin-top:12px;">
      <a class="btn" href="equipes.html">👥 Voir les équipes</a>
      <a class="btn" href="programmation.html">📅 Programmation</a>
    </div>
  </section>

</main>

<style>
  /* ✅ Bandeau "image au centre" */
  .topbar-row-step{
    grid-template-columns: var(--logo-size) 1fr var(--logo-size);
  }
  .step-title-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: calc(var(--logo-size) * 0.55);
  }
  .step-title-img{
    width: min(520px, 100%);
    max-height: 88px;
    height: auto;
    object-fit: contain;
    display:block;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.15));
  }

  /* ✅ NAV: desktop = 1 ligne; téléphone = 2 lignes fixes (3 + 2) */
  .nav-step{
    gap:8px;
    flex-wrap:wrap;
  }
  .nav-step a{
    padding:8px 12px;
    flex: 0 0 auto;
    text-align:center;
    white-space:nowrap;
  }

  @media (max-width: 560px){
    .nav-step{ justify-content:space-between; }
    .nav-step a{ width: calc((100% - 16px) / 3); }           /* 3 items ligne 1 */
    .nav-step a:nth-child(n+4){ width: calc((100% - 8px) / 2); } /* 2 items ligne 2 */
  }

  @media (max-width: 420px){
    .nav-step a{
      padding:7px 10px;
      font-size: 13px;
    }
    .step-title-img{ max-height: 74px; }
  }

  /* ✅ Lien actif plus visible */
  .nav a[aria-current="page"]{
    background: rgba(255,255,255,.26);
    border-color: rgba(255,255,255,.45);
    box-shadow: 0 6px 14px rgba(0,0,0,.10);
  }
</style>

<script type="module">
import { db } from "../assets/js/firebase.js";
import {
  doc, onSnapshot,
  collection, addDoc, setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const COL_PRIVATE = "inscriptions_dh_private";
const COL_PUBLIC  = "equipes_dh_public";
const CFG_FIELD   = "inscriptionsDHState";

const cardForm = document.getElementById("cardForm");
const cardSuccess = document.getElementById("cardSuccess");
const form = document.getElementById("signupForm");
const submitBtn = document.getElementById("submitBtn");
const statusEl = document.getElementById("status");
const gateMsgEl = document.getElementById("gateMsg");

let gateState = "not_open";
let isSubmitting = false;

function showSuccess(){
  cardForm.style.display = "none";
  cardSuccess.style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function normalizeState(s){
  if(s === "suspended") return "paused";
  return s || "not_open";
}

function applyGate(state){
  gateState = normalizeState(state);
  if(gateState === "open"){
    gateMsgEl.textContent = "✅ Inscriptions ouvertes.";
    submitBtn.disabled = false;
  } else {
    submitBtn.disabled = true;
    gateMsgEl.textContent =
      gateState === "closed" ? "🔒 Inscriptions clôturées."
      : gateState === "paused" ? "⏸️ Inscriptions suspendues."
      : "⏳ Pas encore ouvertes.";
  }
}

onSnapshot(doc(db,"config","open"), snap=>{
  const data = snap.data() || {};
  applyGate(data[CFG_FIELD]);
});

form.addEventListener("submit", async e=>{
  e.preventDefault();
  if(isSubmitting || gateState !== "open") return;

  isSubmitting = true;
  submitBtn.disabled = true;
  statusEl.textContent = "Envoi en cours…";

  try{
    const data = {
      createdAt: serverTimestamp(),
      teamName: teamName.value.trim(),
      p1FirstName: p1FirstName.value.trim(),
      p1LastName: p1LastName.value.trim(),
      p1Licence: p1Licence.value.trim(),
      p1Phone: p1Phone.value.trim(),
      p2FirstName: p2FirstName.value.trim(),
      p2LastName: p2LastName.value.trim(),
      p2Licence: p2Licence.value.trim(),
      p2Phone: p2Phone.value.trim()
    };

    const ref = await addDoc(collection(db,COL_PRIVATE), data);

    await setDoc(doc(db,COL_PUBLIC,ref.id),{
      createdAt: serverTimestamp(),
      teamName: data.teamName,
      p1FirstName: data.p1FirstName,
      p2FirstName: data.p2FirstName,
      list: "main",
      stby: false
    });

    form.reset();

    const recap =
      `✅ Inscription enregistrée !\n\n` +
      `Équipe : ${data.teamName}\n` +
      `Joueurs : ${data.p1FirstName} ${data.p1LastName} & ${data.p2FirstName} ${data.p2LastName}`;

    alert(recap);
    showSuccess();

  }catch(err){
    console.error(err);
    statusEl.textContent = "❌ Erreur lors de l’enregistrement.";
    submitBtn.disabled = false;
  }finally{
    isSubmitting = false;
  }
});
</script>

</body>
</html>
