<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscriptions — Double Dames — Open BT Bricorama</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=20260224" />
</head>
<body>

<header class="topbar">
  <div class="container">
    <!-- ✅ Bandeau harmonisé (logo / image / logo) -->
    <div class="topbar-row topbar-row-step">
      <div class="brand-logo">
        <img src="../assets/img/logo-suzini.png" alt="Logo Suzini">
      </div>

      <!-- ✅ Image au centre -->
      <div class="step-title-wrap" aria-label="BT250 — Double Dames">
        <img class="step-title-img" src="../assets/img/bt250-dd.png" alt="BT250 — Double Dames">
      </div>

      <div class="brand-logo">
        <img src="../assets/img/logo-openbt.png" alt="Logo Open BT Bricorama">
      </div>
    </div>

    <!-- ✅ Nav Open BT : 2 lignes fixes sur téléphone (3 + 2), justifiée -->
    <nav class="nav nav-step">
      <a href="../index.html" title="Accueil" aria-label="Accueil">🏠</a>
      <a href="inscriptions.html" aria-current="page">📝 Inscriptions</a>
      <a href="tirage.html" title="Tirage" aria-label="Tirage">🎲</a>
      <a href="equipes.html">👥 Équipes</a>
      <a href="programmation.html">🗓️ Programme</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="card" id="cardForm">
    <h2>📝 Formulaire d’inscription — Double Dames</h2>
    <p id="gateMsg" class="muted">Chargement…</p>

    <form id="signupForm" class="form" autocomplete="on">

      <div class="field">
        <label for="teamName">Nom de l’équipe *</label>
        <input id="teamName" name="teamName" type="text" required maxlength="40" placeholder="Ex : Les beacheuses">
      </div>

      <hr class="sep" />

      <h3 style="margin:0;">Joueuse 1 👩</h3>

      <div class="field">
        <label for="p1LastName">Nom *</label>
        <input id="p1LastName" name="p1LastName" type="text" required placeholder="Nom">
      </div>

      <div class="field">
        <label for="p1FirstName">Prénom *</label>
        <input id="p1FirstName" name="p1FirstName" type="text" required placeholder="Prénom">
      </div>

      <div class="field">
        <label for="p1Licence">N° Licence *</label>
        <input id="p1Licence" name="p1Licence" type="text" required placeholder="Ex : 0123456A">
      </div>

      <div class="field">
        <label for="p1Phone">Téléphone *</label>
        <input id="p1Phone" name="p1Phone" type="tel" required placeholder="Ex : +594... / 06...">
      </div>

      <hr class="sep" />

      <h3 style="margin:0;">Joueuse 2 👩</h3>

      <div class="field">
        <label for="p2LastName">Nom *</label>
        <input id="p2LastName" name="p2LastName" type="text" required placeholder="Nom">
      </div>

      <div class="field">
        <label for="p2FirstName">Prénom *</label>
        <input id="p2FirstName" name="p2FirstName" type="text" required placeholder="Prénom">
      </div>

      <div class="field">
        <label for="p2Licence">N° Licence *</label>
        <input id="p2Licence" name="p2Licence" type="text" required placeholder="Ex : 0123456A">
      </div>

      <div class="field">
        <label for="p2Phone">Téléphone *</label>
        <input id="p2Phone" name="p2Phone" type="tel" required placeholder="Ex : +594... / 06...">
      </div>

      <hr class="sep" />

      <button id="submitBtn" class="btn" type="submit" style="font-weight:900; color:#111;">
        ✅ Valider
      </button>

      <p id="status" class="muted" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="card" id="cardSuccess" style="display:none;">
    <h2>✅ Inscription enregistrée</h2>
    <p class="muted">Merci pour votre inscription 🙌</p>
    <div class="grid" style="margin-top:12px;">
      <a class="btn" href="equipes.html">👥 Voir les équipes</a>
      <a class="btn" href="programmation.html">📅 Programmation</a>
    </div>
  </section>

</main>

<style>
  /* ✅ Bandeau "image au centre" */
  .topbar-row-step{
    grid-template-columns: var(--logo-size) 1fr var(--logo-size);
  }
  .step-title-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: calc(var(--logo-size) * 0.55);
  }
  .step-title-img{
    width: min(520px, 100%);
    max-height: 88px;
    height: auto;
    object-fit: contain;
    display:block;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.15));
  }

  /* ✅ NAV: desktop = 1 ligne; téléphone = 2 lignes fixes (3 + 2) */
  .nav-step{
    gap:8px;
    flex-wrap:wrap;
  }
  .nav-step a{
    padding:8px 12px;
    flex: 0 0 auto;
    text-align:center;
    white-space:nowrap;
  }

  @media (max-width: 560px){
    .nav-step{ justify-content:space-between; }
    .nav-step a{ width: calc((100% - 16px) / 3); }               /* 3 items ligne 1 */
    .nav-step a:nth-child(n+4){ width: calc((100% - 8px) / 2); } /* 2 items ligne 2 */
  }

  @media (max-width: 420px){
    .nav-step a{
      padding:7px 10px;
      font-size: 13px;
    }
    .step-title-img{ max-height: 74px; }
  }

  /* ✅ Lien actif plus visible */
  .nav a[aria-current="page"]{
    background: rgba(255,255,255,.26);
    border-color: rgba(255,255,255,.45);
    box-shadow: 0 6px 14px rgba(0,0,0,.10);
  }
</style>

<script type="module">
  import { db } from "../assets/js/firebase.js";
  import {
    doc, onSnapshot,
    collection, addDoc, setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // Open BT — DD
  const COL_PRIVATE = "inscriptions_dd_private";
  const COL_PUBLIC  = "equipes_dd_public";

  // Gate unique Open BT : config/open (champ exact Firestore)
  const CFG_FIELD = "inscriptionsDDState"; // <- ton champ Firestore

  const cardForm = document.getElementById("cardForm");
  const cardSuccess = document.getElementById("cardSuccess");

  const form = document.getElementById("signupForm");
  const statusEl = document.getElementById("status");
  const gateMsgEl = document.getElementById("gateMsg");
  const submitBtn = document.getElementById("submitBtn");

  let gateState = "not_open"; // open | paused | closed | not_open
  let isSubmitting = false;   // anti double-clic / double submit

  const setStatus = (msg) => { statusEl.textContent = msg; };

  function normalizeState(state){
    if(state === "suspended") return "paused";
    return state || "not_open";
  }

  function showSuccess(){
    // Cache tout le formulaire après validation confirmée
    cardForm.style.display = "none";
    cardSuccess.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function applyGate(stateRaw){
    gateState = normalizeState(stateRaw);

    if(gateState === "open"){
      gateMsgEl.textContent = "✅ Inscriptions ouvertes. Tu peux t’inscrire ci-dessous.";
      submitBtn.disabled = false;
      submitBtn.classList.remove("disabled");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");

    if(gateState === "paused"){
      gateMsgEl.textContent = "⏸️ Inscriptions temporairement suspendues. Réessaie un peu plus tard.";
      return;
    }
    if(gateState === "closed"){
      gateMsgEl.textContent = "🔒 Inscriptions clôturées.";
      return;
    }
    gateMsgEl.textContent = "⏳ Les inscriptions ne sont pas encore ouvertes.";
  }

  // 🔄 Live gate (config/open)
  onSnapshot(doc(db, "config", "open"), (snap)=>{
    const d = snap.exists() ? (snap.data() || {}) : {};
    applyGate(d[CFG_FIELD] || "not_open");
  }, (err)=>{
    console.error(err);
    applyGate("not_open");
    gateMsgEl.textContent = "❌ Impossible de vérifier l’état des inscriptions. Réessaie plus tard.";
  });

  function readFormData(){
    return {
      createdAt: serverTimestamp(),
      teamName: (form.teamName.value || "").trim(),

      p1FirstName: (form.p1FirstName.value || "").trim(),
      p1LastName:  (form.p1LastName.value || "").trim(),
      p1Licence:   (form.p1Licence.value || "").trim(),
      p1Phone:     (form.p1Phone.value || "").trim(),

      p2FirstName: (form.p2FirstName.value || "").trim(),
      p2LastName:  (form.p2LastName.value || "").trim(),
      p2Licence:   (form.p2Licence.value || "").trim(),
      p2Phone:     (form.p2Phone.value || "").trim(),
    };
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if(isSubmitting) return;

    if(gateState !== "open"){
      setStatus("⛔ Inscriptions non ouvertes.");
      return;
    }

    isSubmitting = true;
    submitBtn.disabled = true;
    submitBtn.classList.add("disabled");
    setStatus("Envoi en cours…");

    try {
      const data = readFormData();

      if (!data.teamName || !data.p1FirstName || !data.p1LastName || !data.p2FirstName || !data.p2LastName) {
        throw new Error("Merci de compléter tous les champs obligatoires.");
      }

      // 1) PRIVÉ (doc auto-id)
      const ref = await addDoc(collection(db, COL_PRIVATE), data);

      // 2) PUBLIC (même ID)
      await setDoc(doc(db, COL_PUBLIC, ref.id), {
        createdAt: serverTimestamp(),
        teamName: data.teamName,
        p1FirstName: data.p1FirstName,
        p2FirstName: data.p2FirstName,
        list: "main",
        stby: false
      });

      // reset immédiat (au cas où), puis popup, puis on cache la page
      form.reset();

      const recap =
        `✅ Inscription enregistrée !\n\n` +
        `Équipe : ${data.teamName}\n` +
        `Joueuses : ${data.p1FirstName} ${data.p1LastName} & ${data.p2FirstName} ${data.p2LastName}`;

      alert(recap);

      // Après fermeture du popup : on retire le formulaire
      showSuccess();
      setStatus("");

    } catch (err) {
      console.error(err);
      setStatus("❌ Erreur : " + (err?.message || "Impossible d’enregistrer l’inscription."));
      // si erreur, on ré-autorise
      if(gateState === "open"){
        submitBtn.disabled = false;
        submitBtn.classList.remove("disabled");
      }
    } finally {
      isSubmitting = false;
    }
  });
</script>

</body>
</html>
