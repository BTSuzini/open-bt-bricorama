<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classement — Double Dames — Open BT Bricorama</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=20260228-open-dd-classement-v1" />
</head>
<body>

<header class="topbar">
  <div class="container">
    <div class="topbar-row topbar-row-step">
      <div class="brand-logo">
        <img src="../assets/img/logo-suzini.png" alt="Logo Suzini">
      </div>

      <div class="step-title-wrap" aria-label="BT250 — Double Dames">
        <img class="step-title-img" src="../assets/img/bt250-dd.png" alt="BT250 — Double Dames">
      </div>

      <div class="brand-logo">
        <img src="../assets/img/logo-openbt.png" alt="Logo Open BT Bricorama">
      </div>
    </div>

    <nav class="nav nav-step">
      <a href="../index.html" title="Accueil" aria-label="Accueil">🏠</a>
      <a href="inscriptions.html">📝 Inscriptions</a>
      <a href="tirage.html" title="Tirage" aria-label="Tirage">🎲</a>
      <a href="equipes.html">👥 Équipes</a>
      <a href="programmation.html">🗓️ Programme</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2 style="margin:0 0 10px;">🏆 Classement DD</h2>
    <p class="muted" id="statusText" style="margin:0;">Chargement…</p>
  </section>

  <section class="card">
    <h3 style="margin:0 0 10px;">🎾 Poule DD</h3>
    <div id="pool" class="list"></div>
  </section>
</main>

<style>
  .topbar-row-step{ grid-template-columns: var(--logo-size) 1fr var(--logo-size); }
  .step-title-wrap{ display:flex; align-items:center; justify-content:center; min-height: calc(var(--logo-size) * 0.55); }
  .step-title-img{
    width:min(520px,100%);
    max-height:88px;
    height:auto;
    object-fit:contain;
    display:block;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.15));
  }
  .nav-step{ gap:8px; flex-wrap:wrap; }
  .nav-step a{ padding:8px 12px; flex:0 0 auto; text-align:center; white-space:nowrap; }
  @media (max-width: 560px){
    .nav-step{ justify-content:space-between; }
    .nav-step a{ width: calc((100% - 16px) / 3); }
    .nav-step a:nth-child(n+4){ width: calc((100% - 8px) / 2); }
  }
  @media (max-width: 420px){
    .nav-step a{ padding:7px 10px; font-size: 13px; }
    .step-title-img{ max-height:74px; }
  }

  .list{ display:grid; gap:10px; }
  .rowcard{
    border:1px solid #eee;
    border-radius:14px;
    background:#fff;
    padding:12px;
    box-shadow:0 6px 16px rgba(0,0,0,.04);
    display:flex;
    gap:10px;
    justify-content:space-between;
    align-items:flex-start;
  }
  .left{ min-width:0; }
  .title{ font-weight:1000; line-height:1.15; overflow-wrap:anywhere; }
  .sub{ margin-top:6px; font-size:12px; opacity:.85; line-height:1.35; overflow-wrap:anywhere; }
  .tag{
    border:1px solid rgba(0,0,0,.12);
    border-radius:999px;
    padding:5px 9px;
    font-size:11px;
    font-weight:1000;
    white-space:nowrap;
    opacity:.9;
    flex:0 0 auto;
  }
</style>

<script type="module">
  import { db } from "../assets/js/firebase.js";
  import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const statusText = document.getElementById("statusText");
  const poolBox = document.getElementById("pool");

  function esc(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  }

  function row(r){
    const t = r?.team || {};
    const players = [t.p1FirstName, t.p2FirstName].filter(Boolean).join(" • ");
    const st = `Pts ${r.points} • J ${r.played} • V ${r.wins} • D ${r.losses} • Sets ${r.setDiff} • Jeux ${r.gameDiff}`;
    return `
      <div class="rowcard">
        <div class="left">
          <div class="title">${esc(t.teamName || r.id || "—")}</div>
          ${players ? `<div class="sub muted">${esc(players)}</div>` : ``}
          <div class="sub muted">${esc(st)}</div>
        </div>
        <div class="tag">#${esc(r.rank)}</div>
      </div>
    `;
  }

  onSnapshot(doc(db, "classements_open", "dd"), (snap)=>{
    if(!snap.exists()){
      statusText.textContent = "ℹ️ Classement pas encore publié (saisis des résultats d’abord).";
      poolBox.innerHTML = `<p class="muted" style="margin:0;">—</p>`;
      return;
    }

    const x = snap.data() || {};
    const pool = x?.pool || [];

    statusText.textContent = "🟢 En direct";
    poolBox.innerHTML = pool.length ? pool.map(row).join("") : `<p class="muted" style="margin:0;">—</p>`;
  }, (err)=>{
    console.error(err);
    statusText.textContent = "🔴 Erreur Firestore (classement DD)";
  });
</script>

</body>
</html>
