<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin — Tirage Open BT</title>

<link rel="stylesheet" href="../assets/css/main.css?v=20260227"/>
</head>

<body>

<div id="adminHeader"></div>

<main class="container">

<div id="adminZone"></div>

<section class="card" id="pageContent" style="display:none;">

<h2 style="margin:0 0 10px;">
🎲 Tirage — Open BT Bricorama
</h2>

<p class="muted" id="hint"></p>

<hr class="sep"/>

<div class="grid">

<button class="btn" id="btnLoad">
📥 Charger équipes
</button>

<button class="btn" id="btnDraw">
🎰 Lancer tirage
</button>

<button class="btn" id="btnPublish">
✅ Publier tirage
</button>

</div>

<p id="status" class="muted" style="margin-top:12px;">
En attente…
</p>

</section>

</main>

<script type="module">

import { renderAdminShell }
from "../assets/js/admin-shell.js";

import { auth, db }
from "../assets/js/firebase.js";

import {
getRoleByEmail
} from "../assets/js/session.js";

import {
collection,
getDocs,
query,
orderBy,
doc,
setDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


/* ===============================
   ADMIN SHELL
================================ */
renderAdminShell({
  active:"tirage",
  basePath:".."
});


/* ===============================
   DOM
================================ */

const pageContent =
document.getElementById("pageContent");

const hint =
document.getElementById("hint");

const status =
document.getElementById("status");

const btnLoad =
document.getElementById("btnLoad");

const btnDraw =
document.getElementById("btnDraw");

const btnPublish =
document.getElementById("btnPublish");


/* ===============================
   SCOPE DH / DD
================================ */

const params =
new URLSearchParams(location.search);

const scope =
(params.get("scope") || "").toLowerCase();

/*
scope attendu :
?scope=dh
?scope=dd
*/


function collectionName(){

  if(scope==="dh")
    return "equipes_dh_public";

  if(scope==="dd")
    return "equipes_dd_public";

  return null;
}


/* ===============================
   AUTH GUARD
================================ */

onAuthStateChanged(auth, async(user)=>{

  pageContent.style.display="none";

  if(!user) return;

  const role =
  await getRoleByEmail(user.email);

  if(role!=="admin") return;

  if(!collectionName()){
    hint.textContent =
    "Choisis DH ou DD dans la zone.";
    return;
  }

  hint.textContent =
  scope==="dh"
  ? "Tirage Double Messieurs"
  : "Tirage Double Dames";

  pageContent.style.display="block";

});


/* ===============================
   LOAD TEAMS
================================ */

let teams=[];

btnLoad.onclick = async ()=>{

status.textContent="Chargement équipes…";

const snap =
await getDocs(
query(
collection(db,collectionName()),
orderBy("createdAt","asc")
));

teams=[];

snap.forEach(d=>{
const x=d.data();
if(x.list==="main" && !x.stby)
teams.push({
id:d.id,
teamName:x.teamName,
p1:x.p1FirstName,
p2:x.p2FirstName
});
});

status.textContent=
teams.length+" équipes chargées.";

};


/* ===============================
   DRAW LOGIC
================================ */

btnDraw.onclick = async ()=>{

if(teams.length<4){
alert("Pas assez d’équipes");
return;
}

/*
POULES :
Montjoly / Kourou
*/

const shuffled =
teams.sort(()=>Math.random()-0.5);

const montjoly=[];
const kourou=[];

shuffled.forEach((t,i)=>{
(i%2===0?montjoly:kourou).push(t);
});

await setDoc(
doc(db,"tirages_open",scope),
{
montjoly,
kourou,
createdAt:Date.now()
}
);

status.textContent=
"✅ Tirage effectué";

};


/* ===============================
   PUBLISH
================================ */

btnPublish.onclick = async ()=>{

await setDoc(
doc(db,"tirages_open",scope),
{
published:true
},
{merge:true}
);

status.textContent=
"🌍 Tirage publié";

};

</script>

</body>
</html>
